[project]
name = "enterprise-rag-langgraph"
version = "0.1.0"
description = "Modular RAG service orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0", "langchain-core>=0.3.0", "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0", "langchain-google-genai>=2.0.0",
  "langchain-pinecone>=0.2.0", "pypdf>=5.0.0", "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "structlog>=24.0.0"
]
[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "httpx>=0.27.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
