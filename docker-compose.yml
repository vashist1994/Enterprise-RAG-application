services:
  rag-api:
    image: ${RAG_IMAGE:-enterprise-rag-api:local}
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    image: ${UI_IMAGE:-enterprise-rag-ui:local}
    build: ./web
    depends_on:
      - rag-api
    ports:
      - "127.0.0.1:8080:80"
